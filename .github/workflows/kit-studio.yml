name: MPC Kit Studio - Mac
on:
  push:
    branches: [main, feature/mpc-kit-studio]
    paths:
      - 'mac/KitStudio/**'
      - '.github/workflows/kit-studio.yml'
      - '.github/workflows/kit-studio-verify.yml'
  pull_request:
    paths:
      - 'mac/KitStudio/**'
      - '.github/workflows/kit-studio.yml'
      - '.github/workflows/kit-studio-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kit-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-verify:
    uses: ./.github/workflows/kit-studio-verify.yml
