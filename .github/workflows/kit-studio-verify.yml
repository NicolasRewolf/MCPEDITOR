name: Build and verify current MPC Kit Studio archive
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-archive:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test and package the current revision
        run: bash mac/KitStudio/scripts/build-app.sh
      - name: Verify this job's exact archives, commit, resources and signature
        run: >-
          python3 mac/KitStudio/scripts/release-manifest.py verify mac/KitStudio/dist
          --expect-commit "$GITHUB_SHA" --require-clean
      - name: Verify the extracted archive launches with a visible window
        shell: bash
        run: |
          set -euo pipefail
          UNPACKED="$(mktemp -d "$RUNNER_TEMP/kit-studio-launch.XXXXXX")"
          trap 'rm -rf "$UNPACKED"' EXIT
          ditto -x -k mac/KitStudio/dist/MPC-Kit-Studio-Apple-Silicon.zip "$UNPACKED"
          swift mac/KitStudio/scripts/verify-ci-launch.swift "$UNPACKED/MPC Kit Studio.app"
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Kit-Studio-Apple-Silicon
          path: |
            mac/KitStudio/dist/MPC-Kit-Studio-Apple-Silicon.zip
            mac/KitStudio/dist/MPC-Kit-Studio-Apple-Silicon.dmg
            mac/KitStudio/dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14
